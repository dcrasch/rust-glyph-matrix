[workspace]
members = ["desktop"]
resolver = "3"

[package]
name = "rust-glyph-matrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "rust_glyph_matrix"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"
ndk-context = "0.1"
jni = "0.22"

[profile.dev.package."*"]
opt-level = 2

[package.metadata.android]
package = "dev.rustglyphmatrix.app"
apk_name = "rust-glyph-matrix"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 33
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "com.nothing.ketchum.permission.ENABLE"

[package.metadata.android.application]
label = "Glyphs"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
has_code = true

[[package.metadata.android.application.meta_data]]
name = "NothingKey"
value = "test"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode|density"
orientation = "portrait"
